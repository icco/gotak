version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam
    - wastedassign
  settings:
    staticcheck:
      checks:
        - all
        - -QF1003 # tagged-switch suggestion is a style nit, not a bug
        - -ST1000 # don't require a package comment in every file
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
