name: Release
on:
  schedule:
    # Run daily at midnight UTC; cuts a release only if there are unreleased
    # feat:/fix: commits since the last tag.
    - cron: 0 0 * * *
  workflow_dispatch: # Manual trigger
  push:
    # Pushing a tag by hand releases exactly that version, skipping the
    # semantic-version bump. This does not double-release on the cron path
    # only because checkout below passes no `token:`, so the tag is pushed
    # with GITHUB_TOKEN, and GITHUB_TOKEN pushes do not trigger workflows.
    # Giving checkout a PAT would break that and cause a second release.
    tags:
      - v*
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for semantic versioning
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Determine next version
        id: versioning
        if: github.event_name != 'push'
        uses: PaulHatch/semantic-version@5ae1354e589c5a67345fb2c6e65b025ff676d7c7 # v6.0.7
        with:
          tag_prefix: v
          # Patterns must be wrapped in / / to be treated as regexes. A bare string is
          # a literal substring match, so 'feat:' misses scoped commits like 'feat(x):'.
          major_pattern: /^[a-z]+(\(.+\))?!:/
          minor_pattern: /feat(\(.+\))?:/
          version_format: ${major}.${minor}.${patch}
      - name: Create and push tag
        if: github.event_name != 'push' && steps.versioning.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION_TAG"
          git push origin "$VERSION_TAG"
        env:
          VERSION_TAG: ${{ steps.versioning.outputs.version_tag }}
      - name: Run GoReleaser
        # On a tag push GoReleaser reads the version from the tag itself.
        if: github.event_name == 'push' || steps.versioning.outputs.changed == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          # GH_PAT is needed to push the cask update to icco/homebrew-tap;
          # the default GITHUB_TOKEN can only write to this repo.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
